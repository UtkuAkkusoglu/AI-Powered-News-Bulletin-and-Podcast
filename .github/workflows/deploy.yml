name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main # main branch'ine push geldiğinde otomatik çalışacak

env:
  PROJECT_ID: project-9b6d702e-bc81-4d20-aff       
  GAR_LOCATION: europe-west3           # Frankfurt bölgesi
  REPOSITORY: news-podcast-repo        # Artifact Registry'deki depo adın
  REGION: europe-west3

jobs:
  # ==========================================
  # 1. AŞAMA: BUILD (12-Factor: Build)
  # ==========================================
  build-artifacts:
    name: Build & Push Docker Images
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Google Kimlik Doğrulama
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Docker'ı Google Altyapısı İçin Yetkilendirme
      - name: Authorize Docker
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # API Imajını Build Et ve Artifact Registry'ye Fırlat
      - name: Build & Push API Image
        run: |
          docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }} .
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}

      # Frontend Imajını Build Et ve Artifact Registry'ye Fırlat
      - name: Build & Push Frontend Image
        run: |
          docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }} ./frontend
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }}

  # ==========================================
  # 2. AŞAMA: DEPLOY (12-Factor: Release & Run)
  # ==========================================
  deploy-to-prod:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-22.04
    needs: build-artifacts # 🔴 KİLİT: Paketleme başarıyla bitmeden canlı sunucuya dokunulmaz!
    steps:
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # API'yi Canlıya Al (Imajı doğrudan depodan çeker)
      - name: Deploy Backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: news-and-podcast-api
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: '--allow-unauthenticated --port=8000'

      # Frontend'i Canlıya Al (Imajı doğrudan depodan çeker)
      - name: Deploy Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: news-and-podcast-frontend
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: '--allow-unauthenticated --port=80'